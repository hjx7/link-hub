<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkHub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- 左侧菜单 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">🔗</div>
          <span class="logo-text">LinkHub</span>
        </div>
      </div>
      
      <nav class="sidebar-nav">
        <button class="nav-item active" data-page="sites">
          <span class="nav-icon">🌐</span>
          <span class="nav-text">常用网站</span>
        </button>
        <button class="nav-item" data-page="bookmarks">
          <span class="nav-icon">📁</span>
          <span class="nav-text">我的书签</span>
        </button>
        <button class="nav-item" data-page="tools">
          <span class="nav-icon">🛠️</span>
          <span class="nav-text">实用工具</span>
        </button>
      </nav>
    </aside>
    
    <!-- 主内容区 -->
    <main class="main-content">
      <!-- 常用网站页 -->
      <div class="page active" id="page-sites">
        <div class="page-header">
          <h2>常用网站</h2>
        </div>
        <div class="quick-grid" id="sitesGrid"></div>
      </div>
      
      <!-- 我的书签页 -->
      <div class="page" id="page-bookmarks">
        <!-- 顶部工具栏区域 -->
        <div class="bookmark-toolbar">
          <div class="toolbar-search">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" placeholder="搜索书签..." id="bookmarkFilter">
          </div>
          <div class="toolbar-actions">
            <button class="btn btn-icon" data-action="export-bookmarks" title="导出书签">📤</button>
            <button class="btn btn-icon" data-action="import-bookmarks" title="导入书签">📥</button>
            <input type="file" id="importFileInput" accept=".json" style="display:none">
          </div>
        </div>
        
        <!-- 主体内容区域 -->
        <div class="bookmark-layout">
          <!-- 左侧文件夹树面板 -->
          <div class="bookmark-tree-panel" id="bookmarkTreePanel">
            <div class="tree-panel-content" id="bookmarkTree"></div>
          </div>
          <div class="bookmark-splitter" id="bookmarkSplitter"></div>
          <!-- 右侧书签内容面板 -->
          <div class="bookmark-content-panel" id="bookmarkContentPanel">
            <div class="content-panel-header" id="contentPanelHeader">
              <span class="content-panel-title">📚 书签栏</span>
              <div class="content-panel-actions">
                <button class="btn btn-primary btn-sm" data-action="open-add">➕ 添加书签</button>
                <button class="btn btn-primary btn-sm" data-action="open-add-folder">📁 添加文件夹</button>
              </div>
            </div>
            <div class="content-panel-content" id="bookmarkContent"></div>
          </div>
        </div>
      </div>
      
      <!-- 工具页 -->
      <div class="page" id="page-tools">
        <!-- 工具 Tab 栏 -->
        <div class="tools-tabs">
          <button class="tools-tab active" data-action="tool" data-tool="json">
            <span class="tab-icon">{}</span>
            <span class="tab-text">JSON</span>
          </button>
          <button class="tools-tab" data-action="tool" data-tool="timestamp">
            <span class="tab-icon">⏰</span>
            <span class="tab-text">时间戳</span>
          </button>
          <button class="tools-tab" data-action="tool" data-tool="url">
            <span class="tab-icon">🔗</span>
            <span class="tab-text">URL</span>
          </button>
          <button class="tools-tab" data-action="tool" data-tool="base64">
            <span class="tab-icon">01</span>
            <span class="tab-text">Base64</span>
          </button>
          <button class="tools-tab" data-action="tool" data-tool="color">
            <span class="tab-icon">🎨</span>
            <span class="tab-text">颜色</span>
          </button>
          <button class="tools-tab" data-action="tool" data-tool="uuid">
            <span class="tab-icon">🎲</span>
            <span class="tab-text">UUID</span>
          </button>
        </div>

        <!-- 工具内容区 -->
        <div class="tools-content">
          <!-- JSON 工具：左右双栏布局 -->
          <div class="tool-panel" id="jsonToolPanel">
            <div class="json-editor-container">
              <!-- 左侧输入区 -->
              <div class="json-input-panel">
                <div class="json-panel-header">
                  <span class="json-panel-title">输入</span>
                </div>
                <div class="json-input-wrapper">
                  <textarea class="json-input" id="toolInput" placeholder="输入 JSON 内容..."></textarea>
                </div>
              </div>
              <!-- 右侧输出区 -->
              <div class="json-output-panel">
                <div class="json-panel-header">
                  <span class="json-panel-title">输出</span>
                  <div class="json-mode-toggle">
                    <button class="json-mode-btn active" data-mode="format" data-action="set-json-mode">格式化</button>
                    <button class="json-mode-btn" data-mode="compress" data-action="set-json-mode">压缩</button>
                  </div>
                </div>
                <div class="json-output-wrapper">
                  <div class="json-output" id="toolOutput"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- 非 JSON 工具通用面板 -->
          <div class="tool-panel" id="generalToolPanel" style="display: none;">
            <textarea class="tool-input" id="toolInputGeneral" placeholder="输入内容..."></textarea>
            <div class="tool-output-general" id="toolOutputGeneral"></div>
            <div class="tool-error" id="toolError" style="display: none;"></div>
            <div class="tool-actions">
              <button class="btn btn-primary" id="toolExecuteBtn" data-action="execute-tool">转换</button>
              <button class="btn btn-secondary" data-action="copy-tool">复制</button>
              <button class="btn btn-secondary" data-action="clear-tool">清空</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  
  <!-- 添加/编辑书签弹窗 -->
  <div class="modal" id="bookmarkModal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <span id="bmModalTitle">添加书签</span>
        <button class="close-btn" data-action="close-modal">×</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="bmId">
        <input type="hidden" id="bmParentId">
        <div class="form-group">
          <label>标题</label>
          <input type="text" id="bmTitle" placeholder="书签名称">
        </div>
        <div class="form-group">
          <label>网址</label>
          <input type="url" id="bmUrl" placeholder="https://example.com">
        </div>
        <div class="form-group">
          <label>所属文件夹</label>
          <div class="tree-select" id="treeSelectContainer">
            <div class="tree-select-input" id="treeSelectInput">
              <span class="tree-select-text">书签栏</span>
              <span class="tree-select-arrow">▼</span>
            </div>
            <div class="tree-select-dropdown" id="treeSelectDropdown">
              <div class="tree-select-options" id="treeSelectOptions"></div>
            </div>
          </div>
          <input type="hidden" id="bmCategory" value="1">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-action="close-modal">取消</button>
        <button class="btn btn-primary" data-action="save-bookmark">保存</button>
      </div>
    </div>
  </div>

  <!-- 确认删除弹窗 -->
  <div class="modal" id="confirmModal" style="display: none;">
    <div class="modal-content modal-small">
      <div class="modal-header">
        <span>确认删除</span>
        <button class="close-btn" data-action="close-confirm">×</button>
      </div>
      <div class="modal-body">
        <p id="confirmMessage">确定要删除这个书签吗？</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-action="close-confirm">取消</button>
        <button class="btn btn-danger" data-action="confirm-delete">删除</button>
      </div>
    </div>
  </div>

  <!-- 导入选择弹窗 -->
  <div class="modal" id="importModal" style="display: none;">
    <div class="modal-content modal-small">
      <div class="modal-header">
        <span>导入书签</span>
        <button class="close-btn" data-action="close-import">×</button>
      </div>
      <div class="modal-body">
        <p>请选择导入方式：</p>
        <div class="import-options">
          <button class="btn btn-secondary" data-action="import-merge">🔗 与现有书签合并</button>
          <button class="btn btn-danger" data-action="import-replace">🔄 覆盖现有书签</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 快捷命令面板 -->
  <div class="command-palette-overlay" id="commandPalette" style="display:none;">
    <div class="command-palette">
      <div class="command-input-wrapper">
        <span class="command-input-icon">⌘</span>
        <input type="text" id="commandInput" placeholder="输入命令或关键词..." autocomplete="off">
        <span class="command-input-hint">ESC 关闭</span>
      </div>
      <div class="command-list" id="commandList"></div>
    </div>
  </div>

  <!-- JS 模块（按依赖顺序引入） -->
  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>

  <script src="js/sites.js"></script>
  <script src="js/bookmarks.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/command.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
