<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkHub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- 搜索区域 -->
    <div class="search-section">
      <div class="logo">
        <div class="logo-icon">🔗</div>
        <span class="logo-text">LinkHub</span>
      </div>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜索书签..." autocomplete="off">
      </div>
    </div>

    <!-- 快捷链接 -->
    <div class="quick-links" id="quickLinks">
      <!-- 动态渲染 -->
    </div>

    <!-- 标签切换 -->
    <div class="tabs">
      <button class="tab active" data-tab="bookmarks">📁 我的书签</button>
      <button class="tab" data-tab="categories">📂 分类</button>
      <button class="tab" data-tab="tools">🛠️ 工具</button>
    </div>

    <!-- 内容区域 -->
    <div class="content">
      <!-- 书签列表 -->
      <div class="tab-content active" id="bookmarks-content">
        <div class="bookmark-list" id="bookmarkList">
          <!-- 动态渲染 -->
        </div>
      </div>

      <!-- 分类列表 -->
      <div class="tab-content" id="categories-content">
        <div class="category-list" id="categoryList">
          <!-- 动态渲染 -->
        </div>
      </div>

      <!-- 实用工具 -->
      <div class="tab-content" id="tools-content">
        <div class="tools-grid">
          <button class="tool-btn" data-tool="json">{} JSON</button>
          <button class="tool-btn" data-tool="timestamp">⏰ 时间戳</button>
          <button class="tool-btn" data-tool="url">🔗 URL编码</button>
          <button class="tool-btn" data-tool="base64">01 Base64</button>
        </div>
        <div class="tool-panel" id="toolPanel" style="display: none;">
          <div class="tool-header">
            <span class="tool-title" id="toolTitle"></span>
            <button class="close-tool" onclick="closeTool()">×</button>
          </div>
          <textarea class="tool-input" id="toolInput" placeholder="输入内容..."></textarea>
          <div class="tool-result" id="toolResult"></div>
          <div class="tool-actions">
            <button class="btn btn-primary" onclick="executeTool()">转换</button>
            <button class="btn btn-secondary" onclick="copyResult()">复制</button>
            <button class="btn btn-secondary" onclick="clearTool()">清空</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 底部工具栏 -->
    <div class="footer">
      <button class="footer-btn" onclick="openAddBookmark()" title="添加书签">➕</button>
      <button class="footer-btn" onclick="importBookmarks()" title="导入">⬆️</button>
      <button class="footer-btn" onclick="exportBookmarks()" title="导出">⬇️</button>
      <button class="footer-btn" onclick="openInNewTab()" title="新标签页打开">↗️</button>
    </div>
  </div>

  <!-- 添加书签弹窗 -->
  <div class="modal" id="addModal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <span>添加书签</span>
        <button class="close-modal" onclick="closeAddBookmark()">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>标题</label>
          <input type="text" id="bmTitle" placeholder="书签名称">
        </div>
        <div class="form-group">
          <label>网址</label>
          <input type="url" id="bmUrl" placeholder="https://example.com">
        </div>
        <div class="form-group">
          <label>分类</label>
          <select id="bmCategory">
            <!-- 动态渲染 -->
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeAddBookmark()">取消</button>
        <button class="btn btn-primary" onclick="saveBookmark()">保存</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
