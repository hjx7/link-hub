<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkHub Command</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #1a73e8;
      --primary-light: #e8f0fe;
      --text: #1f2937;
      --text-light: #9ca3af;
      --border: #e5e7eb;
      --white: #ffffff;
      --bg-light: #f3f4f6;
      --radius: 8px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: transparent;
    }

    #overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 15vh;
      backdrop-filter: blur(2px);
    }

    .command-palette {
      width: 560px;
      max-height: 480px;
      background: var(--white);
      border-radius: 12px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .command-input-wrapper {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }

    .command-input-icon {
      font-size: 18px;
      color: var(--text-light);
      flex-shrink: 0;
    }

    .command-input-wrapper input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
      background: transparent;
      color: var(--text);
    }

    .command-input-wrapper input::placeholder {
      color: var(--text-light);
    }

    .command-input-hint {
      font-size: 12px;
      color: var(--text-light);
      background: var(--bg-light);
      padding: 2px 8px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .command-list {
      overflow-y: auto;
      max-height: 400px;
      padding: 8px;
    }

    .command-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.1s;
    }

    .command-item:hover, .command-item.selected {
      background: var(--bg-light);
    }

    .command-item.selected {
      background: var(--primary-light);
    }

    .command-item-icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      background: var(--bg-light);
      border-radius: 6px;
      flex-shrink: 0;
    }

    .command-item.selected .command-item-icon {
      background: var(--white);
    }

    .command-item-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .command-item-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .command-item-desc {
      font-size: 12px;
      color: var(--text-light);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .command-item-type {
      font-size: 11px;
      color: var(--text-light);
      background: var(--bg-light);
      padding: 2px 8px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .command-empty {
      text-align: center;
      padding: 24px;
      color: var(--text-light);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <div class="command-palette">
      <div class="command-input-wrapper">
        <span class="command-input-icon">⌘</span>
        <input type="text" id="input" placeholder="输入命令或关键词..." autocomplete="off">
        <span class="command-input-hint">ESC 关闭</span>
      </div>
      <div class="command-list" id="list"></div>
    </div>
  </div>
  <script src="command.js"></script>
</body>
</html>
